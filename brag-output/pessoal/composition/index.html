<!doctype html>
<html
  lang="pt"
  data-composition-variables='[{"id":"lang","type":"string","label":"Language (pt|en|es)","default":"pt"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=820" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/icons.js"></script>
    <script src="assets/brand.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <style>
      #main { z-index: 10; }

      /* ---------- S1: press start, the name, the card through it ---------- */
      #s1bA { left: 80px; top: -260px; width: 980px; height: 820px; }
      #s1bB { left: 1080px; top: 280px; width: 860px; height: 720px; opacity: 0.7; }
      #ring { position: absolute; inset: 0; width: 1920px; height: 820px; overflow: visible; }
      #ring circle { fill: none; }
      #ringC { stroke: rgba(255, 255, 255, 0.9); stroke-width: 1.6; }
      #ringGlow { stroke: rgba(255, 255, 255, 0.55); stroke-width: 9; }
      #press { position: absolute; left: 0; right: 0; top: 372px; text-align: center; font-family: var(--sans); font-weight: 600; font-size: 62px; line-height: 1; letter-spacing: 0.03em; color: #f6f6f6; text-shadow: 0 0 28px rgba(255, 255, 255, 0.35); }
      #startDot { position: absolute; left: 948px; top: 398px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 0 40px 14px rgba(255, 255, 255, 0.55); opacity: 0; }
      #p1 { top: 214px; font-size: 42px; color: rgba(242, 242, 242, 0.72); }
      .bigName { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-family: var(--serif); font-size: 172px; line-height: 1.1; letter-spacing: -0.012em; white-space: nowrap; color: #f4f4f4; }

      /* ---------- the hero card: S1 into S2 into S3 ---------- */
      #heroWrap { perspective: 1800px; }
      #hero { position: absolute; left: 780px; top: 167px; width: 360px; height: 486px; transform-style: preserve-3d; }
      .face { position: absolute; inset: 0; border-radius: 26px; overflow: hidden; backface-visibility: hidden; background: #111; box-shadow: 0 50px 110px rgba(0, 0, 0, 0.6); }
      .face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .front img { object-position: 50% 30%; filter: contrast(1.04); }
      .front .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.78) 100%), linear-gradient(125deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 42%); }
      .front .sheen { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.24) 50%, transparent 70%); }
      .front .p1 { position: absolute; left: 24px; top: 22px; color: rgba(255, 255, 255, 0.85); }
      .front .nm { position: absolute; left: 24px; right: 24px; bottom: 24px; font-family: var(--serif); font-size: 31px; line-height: 1.05; color: #fff; }
      .front .edge, .back .edge { position: absolute; inset: 0; border-radius: 26px; border: 1px solid rgba(255, 255, 255, 0.2); }
      .back { transform: rotateY(180deg); }
      /* the back shows the part of the full-frame photo that sits under the
         card, so S3 can open out of it without the image jumping */
      .back img { inset: auto; left: -780px; top: -297px; width: 1920px; height: 1080px; filter: contrast(1.04) brightness(0.92); }

      /* ---------- S2: character select ---------- */
      #spot { position: absolute; left: 520px; top: -420px; width: 880px; height: 1300px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.03) 60%, transparent); filter: blur(20px); }
      #floor { position: absolute; left: 470px; top: 600px; width: 980px; height: 240px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, 0.11), transparent); filter: blur(8px); }
      .side { position: absolute; top: 210px; width: 300px; height: 405px; perspective: 1400px; filter: blur(4px); opacity: 0; }
      .side .cardb { position: absolute; inset: 0; border-radius: 22px; background: linear-gradient(160deg, #2a2a2a 0%, #141414 55%, #0b0b0b 100%); border: 1px solid rgba(255, 255, 255, 0.1); display: grid; place-items: center; color: rgba(255, 255, 255, 0.4); }
      .side .mark { width: 96px; height: 62px; }
      .side .mark path { stroke-dasharray: none; }
      #sideL { left: 250px; }
      #sideL .cardb { transform: rotateY(32deg); }
      #sideR { left: 1370px; }
      #sideR .cardb { transform: rotateY(-32deg); }
      #callouts { position: absolute; inset: 0; width: 1920px; height: 820px; }
      #callouts path { fill: none; stroke: rgba(255, 255, 255, 0.55); stroke-width: 1.3; }
      #callouts circle { fill: #f2f2f2; }
      .lbl .kick { color: rgba(242, 242, 242, 0.55); }
      .lbl .v { margin-top: 10px; font-family: var(--serif); font-size: 44px; line-height: 1.05; color: #f4f4f4; }
      #lblL { position: absolute; left: 60px; width: 520px; top: 280px; text-align: right; }
      #lblR { position: absolute; left: 1340px; width: 540px; top: 434px; }
      #s2cap { top: 706px; }

      /* ---------- S3: the base, then the world ---------- */
      #photo { position: absolute; left: 0; top: -130px; width: 1920px; height: 1080px; }
      #photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: contrast(1.04) brightness(0.92); }
      #pin { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      #pin .head { position: absolute; left: -19px; top: -66px; width: 38px; height: 38px; border-radius: 50%; background: #121212; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35); }
      #pin .head::after { content: ''; position: absolute; left: 13px; top: 13px; width: 12px; height: 12px; border-radius: 50%; background: #f2f2f2; }
      #pin .stem { position: absolute; left: -1.5px; top: -30px; width: 3px; height: 30px; background: #121212; border-radius: 2px; }
      .pulse { position: absolute; left: -36px; top: -12px; width: 72px; height: 24px; border-radius: 50%; border: 2px solid rgba(18, 18, 18, 0.75); opacity: 0; }
      #baseTag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 18px; padding: 16px 30px 18px 26px; border-radius: 999px; background: rgba(14, 14, 14, 0.92); color: #f2f2f2; box-shadow: 0 24px 50px rgba(0, 0, 0, 0.3); white-space: nowrap; }
      #baseTag .kick { color: rgba(242, 242, 242, 0.55); font-size: 15px; }
      #baseTag .v { font-weight: 600; font-size: 28px; }
      #space { opacity: 0; }
      #globe { position: absolute; inset: 0; }
      #rim { position: absolute; left: 400px; top: 345px; width: 1120px; height: 1120px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, 0) 90%, rgba(255, 255, 255, 0.18) 95.5%, rgba(255, 255, 255, 0) 100%); filter: blur(5px); }
      #haze { position: absolute; left: 260px; top: 180px; width: 1400px; height: 520px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, 0.1), transparent); filter: blur(30px); }
      #s3cap { top: 132px; }
      #remote { position: absolute; left: 50%; top: 214px; padding: 12px 30px 13px; border-radius: 999px; border: 1.5px solid rgba(255, 255, 255, 0.55); background: rgba(10, 10, 10, 0.4); font-weight: 600; font-size: 24px; letter-spacing: 0.04em; white-space: nowrap; }

      /* ---------- S4: languages, in the light ---------- */
      #s4cam { position: absolute; inset: 0; transform-origin: 50% 58%; }
      #s4cap { top: 160px; }
      #langRow { position: absolute; left: 0; right: 0; top: 410px; display: flex; justify-content: center; gap: 48px; }
      .lang { position: relative; }
      .pill { display: flex; align-items: center; gap: 22px; height: 122px; padding: 0 18px 0 50px; border-radius: 999px; background: linear-gradient(180deg, #262626 0%, #121212 100%); color: #f4f4f4; box-shadow: 0 34px 60px rgba(40, 36, 30, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.14); font-weight: 600; font-size: 42px; white-space: nowrap; }
      .chip { display: flex; align-items: center; height: 86px; padding: 0 32px; border-radius: 999px; background: #f3f2ef; color: #1a1a1a; font-weight: 700; font-size: 32px; }
      .bubble { position: absolute; left: 26px; bottom: calc(100% + 30px); padding: 12px 30px 18px; border-radius: 26px; background: #ffffff; color: var(--graphite); font-family: var(--serif); font-size: 54px; line-height: 1; box-shadow: 0 24px 50px rgba(40, 36, 30, 0.16); transform-origin: 24px 100%; white-space: nowrap; }
      .bubble::after { content: ''; position: absolute; left: 26px; bottom: -11px; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 12px solid #ffffff; }

      /* ---------- S5: inventory, cubes in a grey studio ---------- */
      #s5stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 50% 0%; }
      .cube { position: absolute; width: 150px; height: 150px; transform-style: preserve-3d; }
      .cube .f { position: absolute; inset: 0; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.07); backface-visibility: hidden; display: grid; place-items: center; }
      .cube .f0 { transform: translateZ(75px); }
      .cube .f1 { transform: rotateY(180deg) translateZ(75px); }
      .cube .f2 { transform: rotateY(90deg) translateZ(75px); }
      .cube .f3 { transform: rotateY(-90deg) translateZ(75px); }
      .cube .f4 { transform: rotateX(90deg) translateZ(75px); }
      .cube .f5 { transform: rotateX(-90deg) translateZ(75px); }
      .cube .f0 svg { width: 72px; height: 72px; color: #fff; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35)); }
      .lbl5 { position: absolute; width: 260px; text-align: center; font-weight: 600; font-size: 25px; line-height: 1.15; color: rgba(255, 255, 255, 0.95); text-shadow: 0 2px 12px rgba(0, 0, 0, 0.28); }
      #s5cap { top: 128px; }
      #halo { position: absolute; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0)); filter: blur(20px); opacity: 0; }
      #equipped { position: absolute; padding: 9px 16px 10px; border-radius: 8px; background: #f4f4f4; color: #111; font-weight: 700; font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0; white-space: nowrap; }
      #sweep { position: absolute; left: -1100px; top: -500px; width: 2200px; height: 1800px; border-radius: 50%; background: radial-gradient(closest-side, #050505 72%, rgba(5, 5, 5, 0)); filter: blur(10px); z-index: 5; transform: translateX(-1400px); }

      /* ---------- S6: save, signature ---------- */
      #rings { position: absolute; inset: 0; width: 1920px; height: 820px; overflow: visible; }
      #rings ellipse, #rings circle { fill: none; }
      .rcore { stroke: rgba(255, 255, 255, 0.85); stroke-width: 1.6; }
      .rglow { stroke: rgba(255, 255, 255, 0.45); stroke-width: 8; }
      #track { stroke: rgba(255, 255, 255, 0.14); stroke-width: 1.5; }
      #prog { stroke: #ffffff; stroke-width: 2.6; }
      #progGlow { stroke: rgba(255, 255, 255, 0.6); stroke-width: 10; }
      #saveQ, #saveOk { top: 386px; font-size: 40px; }
      #sign { position: absolute; left: 0; right: 0; top: 236px; text-align: center; font-family: var(--serif); font-size: 240px; line-height: 1; }
      #gh { position: absolute; left: 0; right: 0; top: 528px; text-align: center; font-size: 28px; font-weight: 500; letter-spacing: 0.05em; color: var(--muted); }

      /* ---------- the game frame, editorial ---------- */
      #hud { z-index: 40; opacity: 0; color: #f2f2f2; }
      #hud .hl { position: absolute; left: 64px; top: 38px; font-size: 15px; }
      #hud .hr { position: absolute; right: 64px; top: 38px; display: flex; gap: 18px; align-items: center; font-size: 15px; }
      #hud .rule { position: absolute; left: 64px; right: 64px; top: 70px; height: 1px; background: currentColor; opacity: 0.2; }
      #stageLabel { position: relative; display: inline-block; width: 120px; height: 18px; }
      .stg { position: absolute; right: 0; top: 0; white-space: nowrap; opacity: 0; }
      .pips { display: flex; gap: 6px; }
      .pip { width: 18px; height: 2px; background: currentColor; opacity: 0.25; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="pessoal" data-start="0" data-duration="26" data-width="1920" data-height="820">
      <div id="main" class="layer clip" data-start="0" data-duration="26" data-track-index="1">
        <!-- S1 -->
        <div id="s1" class="scene bg-dark">
          <div class="bokeh" id="s1bA"></div>
          <div class="bokeh" id="s1bB"></div>
          <svg id="ring" viewBox="0 0 1920 820">
            <circle id="ringGlow" cx="960" cy="410" r="200" pathLength="1" filter="url(#glow8)" />
            <circle id="ringC" cx="960" cy="410" r="200" pathLength="1" />
          </svg>
          <div id="startDot"></div>
          <div id="press"></div>
          <div id="p1" class="cap"></div>
          <div id="nameBack" class="bigName"></div>
        </div>

        <!-- S2 studio, under the hero card -->
        <div id="s2" class="scene bg-dark">
          <div id="spot"></div>
          <div id="floor"></div>
          <div class="side" id="sideL"><div class="cardb"></div></div>
          <div class="side" id="sideR"><div class="cardb"></div></div>
        </div>

        <!-- the hero card, from S1 through S3 -->
        <div id="heroWrap" class="layer">
          <div id="hero">
            <div class="face front">
              <img src="assets/joao.webp" alt="" />
              <div class="shade"></div>
              <div class="sheen"></div>
              <div class="p1 kick">P1</div>
              <div class="nm">João Vitor Carmassi</div>
              <div class="edge"></div>
            </div>
            <div class="face back"><img src="assets/pedra-do-bau.webp" alt="" /><div class="edge"></div></div>
          </div>
        </div>

        <!-- the letters that sit in front of the card while it passes through -->
        <div id="nameFront" class="layer"><div class="bigName"></div></div>

        <!-- S2 overlay: callouts and caption -->
        <div id="s2o" class="scene">
          <svg id="callouts" viewBox="0 0 1920 820">
            <path id="lineL" d="M 752 324 L 600 324" pathLength="1" />
            <circle id="dotL" cx="756" cy="324" r="4.5" />
            <path id="lineR" d="M 1168 478 L 1320 478" pathLength="1" />
            <circle id="dotR" cx="1164" cy="478" r="4.5" />
          </svg>
          <div class="lbl" id="lblL"><div class="kick"></div><div class="v"></div></div>
          <div class="lbl" id="lblR"><div class="kick"></div><div class="v"></div></div>
          <div id="s2cap" class="cap"></div>
        </div>

        <!-- S3 -->
        <div id="s3" class="scene">
          <div id="space" class="layer bg-dark">
            <div id="haze"></div>
            <canvas id="globe" width="1920" height="820"></canvas>
            <div id="rim"></div>
          </div>
          <div id="photo"><img src="assets/pedra-do-bau.webp" alt="" /></div>
          <div id="pin"><div class="pulse" id="pul0"></div><div class="pulse" id="pul1"></div><div class="stem"></div><div class="head"></div></div>
          <div id="baseTag"><span class="kick"></span><span class="v"></span></div>
          <div id="s3cap" class="cap"></div>
          <div id="remote"></div>
        </div>

        <!-- S4 -->
        <div id="s4" class="scene bg-light">
          <div id="s4cam">
            <div id="s4cap" class="cap ink"></div>
            <div id="langRow"></div>
          </div>
        </div>

        <!-- S5 -->
        <div id="s5" class="scene bg-gray">
          <div id="s5cap" class="cap"></div>
          <div id="halo"></div>
          <div id="s5stage"></div>
          <div id="labels5"></div>
          <div id="equipped"></div>
        </div>

        <div id="sweep"></div>

        <!-- S6 -->
        <div id="s6" class="scene bg-dark">
          <svg id="rings" viewBox="0 0 1920 820">
            <g id="ringsG">
              <g transform="translate(960 410) rotate(-16)">
                <ellipse class="rglow" rx="560" ry="176" pathLength="1" filter="url(#glow8)" />
                <ellipse class="rcore" rx="560" ry="176" pathLength="1" />
                <ellipse class="rglow" rx="450" ry="142" pathLength="1" filter="url(#glow8)" />
                <ellipse class="rcore" rx="450" ry="142" pathLength="1" />
                <ellipse class="rglow" rx="340" ry="108" pathLength="1" filter="url(#glow8)" />
                <ellipse class="rcore" rx="340" ry="108" pathLength="1" />
              </g>
              <circle id="track" cx="960" cy="410" r="200" />
              <circle id="progGlow" cx="960" cy="410" r="200" pathLength="1" filter="url(#glow8)" transform="rotate(-90 960 410)" />
              <circle id="prog" cx="960" cy="410" r="200" pathLength="1" transform="rotate(-90 960 410)" />
            </g>
          </svg>
          <div id="saveQ" class="cap"></div>
          <div id="saveOk" class="cap"></div>
          <div id="sign">joão.</div>
          <div id="gh">github.com/joao-carmassi</div>
        </div>

        <div id="hud" class="layer">
          <div class="hl kick">P1 · João</div>
          <div class="hr kick"><span id="stageLabel"></span><div class="pips" id="pips"></div></div>
          <div class="rule"></div>
        </div>
      </div>
    </div>

    <script>
      const STRINGS = {
        pt: {
          press: 'press start', p1: 'jogador 1', selected: 'personagem selecionado',
          stats: [['classe', 'desenvolvedor front-end'], ['origem', 'são paulo, 2004']],
          baseK: 'base', baseV: 'São Bento do Sapucaí, SP',
          route: 'da serra para o mundo.', remote: '100% remoto',
          stage: 'fase',
          langTitle: 'idiomas',
          langs: [['português', 'nativo'], ['inglês', 'C1'], ['espanhol', 'B2']],
          invTitle: 'inventário',
          items: ['trilhas', 'viajar de moto', 'música', 'games', 'filmes', 'código'],
          equipped: 'equipado',
          saveQ: 'salvar progresso?', saveOk: '✓ progresso salvo',
        },
        en: {
          press: 'press start', p1: 'player 1', selected: 'character selected',
          stats: [['class', 'front-end developer'], ['origin', 'são paulo, 2004']],
          baseK: 'base', baseV: 'São Bento do Sapucaí, SP',
          route: 'from the mountains to the world.', remote: '100% remote',
          stage: 'stage',
          langTitle: 'languages',
          langs: [['portuguese', 'native'], ['english', 'C1'], ['spanish', 'B2']],
          invTitle: 'inventory',
          items: ['hiking', 'motorcycle trips', 'music', 'games', 'movies', 'code'],
          equipped: 'equipped',
          saveQ: 'save progress?', saveOk: '✓ progress saved',
        },
        es: {
          press: 'press start', p1: 'jugador 1', selected: 'personaje seleccionado',
          stats: [['clase', 'desarrollador front-end'], ['origen', 'são paulo, 2004']],
          baseK: 'base', baseV: 'São Bento do Sapucaí, SP',
          route: 'de la sierra al mundo.', remote: '100% remoto',
          stage: 'nivel',
          langTitle: 'idiomas',
          langs: [['portugués', 'nativo'], ['inglés', 'C1'], ['español', 'B2']],
          invTitle: 'inventario',
          items: ['senderismo', 'viajes en moto', 'música', 'videojuegos', 'películas', 'código'],
          equipped: 'equipado',
          saveQ: '¿guardar progreso?', saveOk: '✓ progreso guardado',
        },
      };

      const D = 26;
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const lang = STRINGS[vars.lang] ? vars.lang : 'pt';
      const T = STRINGS[lang];
      document.documentElement.lang = lang;

      const $ = (s) => document.querySelector(s);
      const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

      BRAND.mount($('#root'));

      // ---------- copy ----------
      $('#press').innerHTML = BRAND.chars(T.press);
      const pressChars = $$('#press .ch');
      const p1Words = BRAND.words($('#p1'), T.p1);
      const NAME = 'João Vitor Carmassi';
      $('#nameBack').innerHTML = BRAND.chars(NAME);
      $('#nameFront .bigName').innerHTML = BRAND.chars(NAME);
      const backChars = $$('#nameBack .ch');
      const frontChars = $$('#nameFront .ch');
      $$('.side .cardb').forEach((c) => (c.innerHTML = BRAND.markSvg()));
      [['#lblL', 0], ['#lblR', 1]].forEach(([sel, i]) => {
        $(sel + ' .kick').textContent = T.stats[i][0];
        $(sel + ' .v').textContent = T.stats[i][1];
      });
      const s2Words = BRAND.words($('#s2cap'), T.selected);
      $('#baseTag .kick').textContent = T.baseK;
      $('#baseTag .v').textContent = T.baseV;
      const s3Words = BRAND.words($('#s3cap'), T.route);
      $('#remote').textContent = T.remote;
      const s4Words = BRAND.words($('#s4cap'), T.langTitle);
      const HELLO = ['olá', 'hello', 'hola'];
      T.langs.forEach(([name, level], i) => {
        $('#langRow').insertAdjacentHTML('beforeend',
          `<div class="lang" id="lang${i}"><div class="bubble">${HELLO[i]}</div><div class="pill"><span>${name}</span><span class="chip">${level}</span></div></div>`);
      });
      const s5Words = BRAND.words($('#s5cap'), T.invTitle);
      $('#equipped').textContent = T.equipped;
      const saveQWords = BRAND.words($('#saveQ'), T.saveQ);
      $('#saveOk').textContent = T.saveOk;

      // ---------- S5 cubes ----------
      const ICON_KEYS = ['trail', 'moto', 'music', 'games', 'film', 'code'];
      const CUBE = ICON_KEYS.map((key, i) => {
        const cx = 330 + i * 252, cy = 438 - i * 10;
        const el = document.createElement('div');
        el.className = 'cube';
        el.style.left = cx - 75 + 'px';
        el.style.top = cy - 75 + 'px';
        el.innerHTML = [0, 1, 2, 3, 4, 5].map((f) => `<div class="f f${f}">${f === 0 ? ICONS[key] : ''}</div>`).join('');
        $('#s5stage').appendChild(el);
        $('#labels5').insertAdjacentHTML('beforeend', `<div class="lbl5" style="left:${cx - 130}px;top:${cy + 112}px">${T.items[i]}</div>`);
        // each cube's pose, tweened by the timeline and drawn by frame()
        return { el, faces: $$('.f', el), cx, cy, x: 0, y: -620, z: 0, rx: -200, ry: 150 + i * 24, rz: 40, o: 0, glow: 0, land: 0 };
      });
      const lbl5 = $$('.lbl5');

      // CSS rotation matrices (y points down), and the key light, up and to the left
      const rotX = (v, a) => [v[0], v[1] * Math.cos(a) - v[2] * Math.sin(a), v[1] * Math.sin(a) + v[2] * Math.cos(a)];
      const rotY = (v, a) => [v[0] * Math.cos(a) + v[2] * Math.sin(a), v[1], -v[0] * Math.sin(a) + v[2] * Math.cos(a)];
      const rotZ = (v, a) => [v[0] * Math.cos(a) - v[1] * Math.sin(a), v[0] * Math.sin(a) + v[1] * Math.cos(a), v[2]];
      const LIGHT = (() => { const l = [-0.45, -0.75, 0.5]; const n = Math.hypot(...l); return l.map((c) => c / n); })();
      const NORMALS = [[0, 0, 1], [0, 0, -1], [1, 0, 0], [-1, 0, 0], [0, -1, 0], [0, 1, 0]];
      const RAD = Math.PI / 180;
      const drawCubes = (t) => {
        CUBE.forEach((c, i) => {
          // a slow sway once it has landed
          const sway = c.land * 5 * Math.sin(t * 1.4 + i * 0.9);
          const rx = c.rx, ry = c.ry + sway, rz = c.rz;
          c.el.style.transform = `translate3d(${c.x}px, ${c.y}px, ${c.z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
          // opacity on a preserve-3d box would flatten it, so it goes on the faces
          c.faces.forEach((f) => (f.style.opacity = c.o));
          NORMALS.forEach((n, f) => {
            const v = rotX(rotY(rotZ(n, rz * RAD), ry * RAD), rx * RAD);
            const d = Math.max(0, v[0] * LIGHT[0] + v[1] * LIGHT[1] + v[2] * LIGHT[2]);
            const k = 0.14 + 0.86 * Math.pow(d, 1.25) + c.glow * 0.35;
            const g = Math.round(16 + k * 122);
            c.faces[f].style.background = `linear-gradient(155deg, rgb(${g + 16},${g + 16},${g + 16}) 0%, rgb(${g},${g},${g}) 62%, rgb(${g - 8},${g - 8},${g - 8}) 100%)`;
          });
        });
      };

      // ---------- S3 photo and globe ----------
      // the pin on the rock, in the photo's own px (the photo is 1920x1080, set 130px up)
      const PX0 = 818, PY0 = 330;
      const photo = { s: 1, ox: 0, oy: 0, r: 1500 };

      const GLOBE = { cx: 960, cy: 905, R: 540, tilt: 0.38 };
      const lon = (t) => 0.12 * t;
      const toView = (p, t) => {
        const l = lon(t), a = GLOBE.tilt;
        const x1 = p[0] * Math.cos(l) + p[2] * Math.sin(l), z1 = -p[0] * Math.sin(l) + p[2] * Math.cos(l), y1 = p[1];
        return [x1, y1 * Math.cos(a) - z1 * Math.sin(a), y1 * Math.sin(a) + z1 * Math.cos(a)];
      };
      const toModel = (v, t) => {
        const l = lon(t), a = GLOBE.tilt;
        const y1 = v[1] * Math.cos(a) + v[2] * Math.sin(a), z1 = -v[1] * Math.sin(a) + v[2] * Math.cos(a), x1 = v[0];
        return [x1 * Math.cos(l) - z1 * Math.sin(l), y1, x1 * Math.sin(l) + z1 * Math.cos(l)];
      };
      const norm = (v) => { const n = Math.hypot(...v); return v.map((c) => c / n); };
      const scr = (v) => [GLOBE.cx + v[0] * GLOBE.R, GLOBE.cy - v[1] * GLOBE.R];
      const T_LAND = 12.0;
      const PIN = toModel(norm([-0.17, 0.78, 0.6]), T_LAND);
      const [GX, GY] = scr(toView(PIN, T_LAND));
      const TARGETS = [[0.78, 0.42, 0.46], [0.95, 0.12, 0.28], [-0.82, 0.48, 0.3], [-0.5, 0.84, 0.2], [0.36, 0.92, 0.12], [0.3, 0.55, 0.78], [-0.96, 0.08, 0.26]]
        .map((v) => toModel(norm(v), T_LAND));
      const N_DOTS = 5200;
      const DOTS = Array.from({ length: N_DOTS }, (_, i) => {
        const y = 1 - (2 * (i + 0.5)) / N_DOTS, r = Math.sqrt(1 - y * y), ph = i * 2.399963;
        return [Math.cos(ph) * r, y, Math.sin(ph) * r];
      });
      const slerp = (a, b, s) => {
        const w = Math.acos(clamp(a[0] * b[0] + a[1] * b[1] + a[2] * b[2], -1, 1));
        const sw = Math.sin(w) || 1;
        const k0 = Math.sin((1 - s) * w) / sw, k1 = Math.sin(s * w) / sw;
        return [a[0] * k0 + b[0] * k1, a[1] * k0 + b[1] * k1, a[2] * k0 + b[2] * k1];
      };
      const cv = $('#globe');
      const ctx = cv.getContext('2d');
      const globeState = { a: 0, arcs: 0 };
      const ARC0 = 12.05, ARC_GAP = 0.09, ARC_DUR = 0.8;
      const drawGlobe = (t) => {
        ctx.clearRect(0, 0, 1920, 820);
        if (globeState.a <= 0.001) return;
        ctx.globalAlpha = globeState.a;
        for (const p of DOTS) {
          const v = toView(p, t);
          if (v[2] <= 0) continue;
          const [x, y] = scr(v);
          if (y > 830) continue;
          ctx.fillStyle = `rgba(255,255,255,${(0.1 + 0.7 * Math.pow(v[2], 1.6)).toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(x, y, 0.7 + 1.1 * v[2], 0, Math.PI * 2);
          ctx.fill();
        }
        // the routes out of the serra
        TARGETS.forEach((b, i) => {
          const u = clamp((t - (ARC0 + i * ARC_GAP)) / ARC_DUR);
          if (u <= 0) return;
          const e = 1 - Math.pow(1 - u, 2.2);
          const w = Math.acos(clamp(PIN[0] * b[0] + PIN[1] * b[1] + PIN[2] * b[2], -1, 1));
          const n = 44;
          let prev = null;
          for (let k = 0; k <= n; k++) {
            const s = (k / n) * e;
            const h = 1 + (0.12 + 0.22 * (w / Math.PI)) * Math.sin(Math.PI * s);
            const v = toView(slerp(PIN, b, s).map((c) => c * h), t);
            const pt = scr(v);
            if (prev) {
              ctx.strokeStyle = `rgba(255,255,255,${((0.12 + 0.78 * (k / n)) * globeState.arcs).toFixed(3)})`;
              ctx.lineWidth = 1.7;
              ctx.beginPath();
              ctx.moveTo(prev[0], prev[1]);
              ctx.lineTo(pt[0], pt[1]);
              ctx.stroke();
            }
            prev = pt;
          }
          ctx.fillStyle = `rgba(255,255,255,${globeState.arcs})`;
          ctx.beginPath();
          ctx.arc(prev[0], prev[1], 3.2, 0, Math.PI * 2);
          ctx.fill();
          if (u >= 1) {
            const q = clamp((t - (ARC0 + i * ARC_GAP + ARC_DUR)) / 0.7);
            ctx.strokeStyle = `rgba(255,255,255,${((1 - q) * 0.7 * globeState.arcs).toFixed(3)})`;
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.arc(prev[0], prev[1], 3 + q * 16, 0, Math.PI * 2);
            ctx.stroke();
          }
        });
        // the serra itself
        const [px, py] = scr(toView(PIN, t));
        const halo = ctx.createRadialGradient(px, py, 0, px, py, 30);
        halo.addColorStop(0, 'rgba(255,255,255,0.45)');
        halo.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(px, py, 30, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(px, py, 5.5, 0, Math.PI * 2);
        ctx.fill();
        const q = ((t - T_LAND) % 0.9) / 0.9;
        if (t > T_LAND) {
          ctx.strokeStyle = `rgba(255,255,255,${(0.6 * (1 - q)).toFixed(3)})`;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(px, py, 6 + q * 26, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      };

      // the centre of the dark shape that wipes S5 into S6
      const sweep = { x: -1400 };
      // how far S3 has opened out of the card's frame (0 = the card, 1 = full frame)
      const reveal = { p: 0 };

      // ---------- HUD ----------
      const STAGES = 5;

        $('#stageLabel').insertAdjacentHTML('beforeend', `<span class="stg">${T.stage} ${i + 1}/${STAGES}</span>`);
      }
      const pipEls = $$('.pip');

      // ---------- baselines ----------
      gsap.set('#heroWrap', { opacity: 0, filter: 'blur(9px)' });

      // ---------- timeline ----------

      tl.fromTo(pressChars, { opacity: 0, filter: 'blur(12px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.42, stagger: 0.045, ease: 'power2.out' }, 2.9);
      tl.fromTo(['#ringC', '#ringGlow'], { attr: { r: 190 }, opacity: 0 }, { attr: { r: 262 }, opacity: 1, duration: 0.9, ease: 'power2.out' }, 2.85);
      tl.to(['#ringC', '#ringGlow'], { attr: { 'stroke-dashoffset': -1.15 }, duration: 1.25, ease: 'power1.inOut' }, 2.85);
      tl.to(['#ringC', '#ringGlow'], { attr: { r: 4 }, opacity: 0, duration: 0.32, ease: 'power3.in' }, 3.82);
      tl.to('#press', { opacity: 0, scale: 0.9, filter: 'blur(12px)', duration: 0.3, ease: 'power2.in' }, 3.86);
      tl.fromTo('#startDot', { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1.4, duration: 0.16, ease: 'power2.out' }, 4.1);
      tl.to('#startDot', { opacity: 0, scale: 3.2, duration: 0.45, ease: 'power2.out' }, 4.26);
      // the name rises letter by letter; the copy in front of the card moves with it
      tl.fromTo([...backChars, ...frontChars], { opacity: 0, y: 46, filter: 'blur(14px)' }, {

      // the card: far behind the letters, through them, and it lands at its

      tl.to('#heroWrap', { opacity: 1, duration: 0.35 }, 4.75);
      tl.to('#heroWrap', { filter: 'blur(0px)', duration: 0.62, ease: 'power1.in' }, 4.75);
      tl.to('#hero', { scale: 0.6, rotationY: 12, rotationZ: -3, duration: 0.6, ease: 'power1.in' }, 4.75);
      tl.set(frontChars.filter((_, i) => i % 2 === 0), { visibility: 'hidden' }, 5.33);
      tl.to('#hero', { scale: 1, rotationY: -12, rotationZ: 0, duration: 0.75, ease: 'power3.out' }, 5.35);
      BRAND.blurOut(tl, '#p1', 5.2, 0.3);
      tl.to([...backChars, ...frontChars], {
        x: (i) => ((i % NAME.length) - (NAME.length - 1) / 2) * 26,
        opacity: 0, filter: 'blur(16px)', duration: 0.5, ease: 'power2.in',
      }, 5.5);

      // S2 (5.75 -> 9.8): the studio builds around the card into a character select
      tl.fromTo('#s2', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power1.inOut', immediateRender: false }, 5.75);
      tl.set('#s1', { opacity: 0 }, 6.3);
      tl.set('#s2o', { opacity: 1 }, 6.0);
      tl.to('#hero', { rotationY: 10, duration: 2.2, ease: 'sine.inOut' }, 7.0);
      tl.to('#hero', { y: -10, duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 7.0);
      tl.fromTo('#hero .sheen', { xPercent: -130 }, { xPercent: 130, duration: 0.9, ease: 'power2.inOut' }, 6.75);
      tl.fromTo('#sideL', { x: -280, opacity: 0 }, { x: 0, opacity: 0.6, duration: 0.85, ease: 'power3.out' }, 6.3);
      tl.fromTo('#sideR', { x: 280, opacity: 0 }, { x: 0, opacity: 0.6, duration: 0.85, ease: 'power3.out' }, 6.3);
      tl.fromTo('#spot', { opacity: 0 }, { opacity: 1, duration: 0.8 }, 5.85);
      tl.fromTo('#hud', { opacity: 0 }, { opacity: 1, duration: 0.5 }, 6.3);
      BRAND.capIn(tl, s2Words, 6.55);
      tl.to('#lineL', { attr: { 'stroke-dashoffset': 0 }, duration: 0.4, ease: 'power2.out' }, 7.0);
      tl.fromTo('#dotL', { opacity: 0 }, { opacity: 1, duration: 0.2 }, 7.0);
      tl.fromTo('#lblL > *', { opacity: 0, x: 16, filter: 'blur(8px)' }, { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.5, stagger: 0.08, ease: 'power3.out' }, 7.18);
      tl.to('#lineR', { attr: { 'stroke-dashoffset': 0 }, duration: 0.4, ease: 'power2.out' }, 7.4);
      tl.fromTo('#dotR', { opacity: 0 }, { opacity: 1, duration: 0.2 }, 7.4);
      tl.fromTo('#lblR > *', { opacity: 0, x: -16, filter: 'blur(8px)' }, { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.5, stagger: 0.08, ease: 'power3.out' }, 7.58);
      BRAND.blurOut(tl, '#s2o', 9.12, 0.3);
      tl.to('#sideL', { x: -460, opacity: 0, duration: 0.45, ease: 'power2.in' }, 9.2);

      tl.set(['#s2', '#heroWrap'], { opacity: 0 }, 10.4);
      tl.to('#hud', { color: '#2f2e2b', duration: 0.3 }, 9.95);
      tl.fromTo('#pin', { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.55, ease: 'bounce.out' }, 10.2);
      [0, 1].forEach((i) => tl.fromTo(`#pul${i}`, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 2.6, duration: 1.0, ease: 'power2.out' }, 10.55 + i * 0.4));
      tl.fromTo('#baseTag', { opacity: 0, x: -14, filter: 'blur(8px)' }, { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power3.out' }, 10.4);
      tl.to(['#pin', '#baseTag'], { opacity: 0, duration: 0.2 }, 11.25);
      tl.to('#space', { opacity: 1, duration: 0.45, ease: 'power1.inOut' }, 11.3);
      tl.to(photo, { s: 0.034, ox: GX - PX0, oy: GY - (PY0 - 130), duration: 0.75, ease: 'power3.inOut' }, 11.3);
      // an iris closes on the pin while the camera pulls back

      tl.to('#photo', { opacity: 0, duration: 0.15 }, 11.98);
      tl.to('#hud', { color: '#f2f2f2', duration: 0.3 }, 11.4);
      tl.to(globeState, { a: 1, duration: 0.5, ease: 'power1.out' }, 11.35);
      tl.fromTo(globeState, { arcs: 0 }, { arcs: 1, duration: 0.1, immediateRender: false }, ARC0);
      BRAND.capIn(tl, s3Words, 12.15);
      tl.fromTo('#remote', { opacity: 0, scale: 0.9, filter: 'blur(8px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.5, ease: 'power3.out' }, 12.75);

      tl.to('#saveOk', { opacity: 0, filter: 'blur(8px)', duration: 0.2 }, 22.55);

      // HUD: one stage label and one more pip per scene
      [6.3, 9.8, 13.95, 17.3, 21.05].forEach((t, i) => {

      });

      // everything drawn from state (the cubes, the photo, the globe) is
      // drawn once the timeline has moved every tween to the new time
      const frame = (t) => {
        drawPhoto();
        const k = 1 - reveal.p;
        $('#s3').style.clipPath = k > 0 ? `inset(${167 * k}px ${780 * k}px ${167 * k}px ${780 * k}px round ${26 * k}px)` : 'none';
        $('#sweep').style.transform = `translateX(${sweep.x}px)`;
        $('#s6').style.clipPath = `inset(0 ${clamp(1920 - sweep.x, 0, 1920)}px 0 0)`;
        if (t > 11.2 && t < 14.1) drawGlobe(t); else ctx.clearRect(0, 0, 1920, 820);
        if (t > 16.9 && t < 21.2) drawCubes(t);
      };
      tl.eventCallback('onUpdate', () => frame(tl.time()));
      frame(0);
      drawCubes(0);

      window.__timelines = window.__timelines || {};
      window.__timelines['pessoal'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
