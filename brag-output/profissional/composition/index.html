    <script>
      const STRINGS = {
        pt: {

          open: 'aberto agora', places: '40+ lugares', pix: 'PIX −7%',

          role: 'front-end developer', cta: 'tell me about your project →',

      const D = 26;

      BRAND.mount($('#root'));

      // ---------- copy ----------

      const CODE = [

      });

      const STACK = [
        ['nextjs', 'Next.js'], ['react', 'React'], ['typescript', 'TypeScript'],
        ['tailwind', 'Tailwind'], ['astro', 'Astro'], ['gsap', 'GSAP'],
        ['reactquery', 'React Query'], ['zustand', 'Zustand'], ['git', 'Git'],

      const apps = STACK.map(([key, name], i) => {
        const icon = key === 'zustand'
          ? '<img src="assets/zustand.svg" alt="" />'
          : `<svg viewBox="0 0 24 24"><path d="${ICONS[key].path}" fill="#f2f2f2"/></svg>`;

        a.style.left = (i % 3) * 315 + 'px';
        a.style.top = Math.floor(i / 3) * 232 + 'px';

      });

      // ---------- S3: the world the camera flies through ----------
      const F = 1000;
      const world = $('#world');
      const win = (img, url) =>
        `<div class="bar"><i></i><i></i><i></i>${url ? `<span class="u">${url}</span>` : ''}</div><div class="page"><img src="assets/${img}.webp" alt="" /></div>`;
      const ITEMS = [];
      const add = (cls, html, x, y, z, extra = {}) => {
        const e = el(world, 'item ' + cls, html);
        const it = { el: e, x, y, z, o: 1, ...extra };
        ITEMS.push(it);
        return it;
      };
      add('win panel', win('jean', ''), 600, -80, -420);
      add('win panel', win('refugio', 'refugiodapedrasp.com'), -60, 0, 0);
      add('win panel', win('vrf', 'lojadovrf.com.br'), 40, 0, -1600);
      const pix = add('chip', T.pix, 470, -190, -1350, { o: 0, sharp: true });
      add('win panel', win('mapa', 'mapaturisticosaobento.com'), -40, 0, -3200);
      const places = add('chip', T.places, -480, -210, -2940, { o: 0, sharp: true });
      const openNow = add('chip dark', T.open, 420, 200, -2900, { o: 0, sharp: true });
      add('win panel', win('higgx', ''), 560, -80, -5220);
      add('win panel', win('qf', 'quotationfactory.com'), -120, 0, -4800);
      const kpis = T.kpis.map(([n, l], i) => add('kpi', `<b>${n}</b><span>${l}</span>`, -320 + i * 360, 120, -4560, { o: 0, sharp: true }));
      const cam = { x: 60, y: 0, z: 2600 };
      const drawWorld = () => {
        for (const it of ITEMS) {
          const d = cam.z - it.z;
          const vis = clamp((d - 90) / 260) * clamp(1 - (d - 3600) / 900) * it.o;
          if (vis <= 0.001) { it.el.style.opacity = 0; continue; }
          const s = F / d;
          const sx = 960 + (it.x - cam.x) * s, sy = 350 + (it.y - cam.y) * s;
          const ry = (it.x - cam.x) * -0.012;
          it.el.style.opacity = vis;
          it.el.style.zIndex = Math.round(20000 - d);
          it.el.style.transform = `translate(${sx}px, ${sy}px) translate(-50%, -50%) perspective(1800px) rotateY(${ry}deg) scale(${s})`;
          // depth of field on the windows only: the chips sit in front of the
          // window in focus and are read, so they stay sharp
          it.el.style.filter = it.sharp ? 'none' : `blur(${Math.min(14, (Math.abs(d - F) / F) * 9).toFixed(2)}px)`;
        }
      };
      const cats = T.layouts.map(([title, sub], i) =>
        el($('#cats'), 'cat', `<div class="kick">0${i + 1} / 04</div><div class="ti">${title}</div><div class="su">${sub}</div>`));

      // ---------- S4 ----------
      const s4Words1 = BRAND.words($('#s4cap1'), T.motionTitle);
      const s4Words2 = BRAND.words($('#s4cap2'), T.motionSub);
      $('#pbtn span').textContent = T.prismaBtn;
      const BAR_H = [90, 150, 120, 210, 170, 260, 220, 300, 250];
      const barEls = BAR_H.map((h, i) => {
        const b = el($('#bars'), 'barc');
        b.style.left = 1250 + i * 50 + 'px';
        b.style.height = h + 'px';
        return b;
      });
      // points along the power3.out curve, evenly spaced in x: the dot moves
      // at a constant speed in time, so its height draws the ease
      const bez = (u, a, b, c, d) => (1 - u) ** 3 * a + 3 * (1 - u) ** 2 * u * b + 3 * (1 - u) * u * u * c + u ** 3 * d;
      const CURVE = [220, 690, 708, 170, 1226, 170, 1700, 170];
      const curvePts = Array.from({ length: 41 }, (_, k) => {
        const tx = 220 + (1480 * k) / 40;
        let lo = 0, hi = 1;
        for (let n = 0; n < 30; n++) {
          const m = (lo + hi) / 2;
          if (bez(m, CURVE[0], CURVE[2], CURVE[4], CURVE[6]) < tx) lo = m; else hi = m;
        }
        const u = (lo + hi) / 2;
        return { cx: bez(u, CURVE[0], CURVE[2], CURVE[4], CURVE[6]), cy: bez(u, CURVE[1], CURVE[3], CURVE[5], CURVE[7]) };
      });

      // ---------- S5 ----------
      const s5Words = BRAND.words($('#s5cap'), T.seoTitle);
      $('#query').textContent = T.query;
      const RES_GAP = 112;
      const results = [0, 1, 2, 3].map((i) => {
        const r = el($('#results'), 'res' + (i === 3 ? ' me' : ''),
          `<i style="left:30px;top:20px;width:200px;height:12px"></i><i style="left:30px;top:42px;width:470px;height:20px"></i><i style="left:30px;top:72px;width:620px;height:10px"></i>`);
        if (i === 3) el(r, 'rank', '#1');
        return r;
      });
      const RING_POS = [[1230, 150], [1530, 150], [1230, 420], [1530, 420]];
      const RR = 74, RC = 2 * Math.PI * RR;
      const rings = T.rings.map((label, i) => {
        const r = el($('#rings'), 'ring');
        r.style.left = RING_POS[i][0] + 'px';
        r.style.top = RING_POS[i][1] + 'px';
        r.innerHTML = `<svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="${RR}" stroke="rgba(47,46,43,.12)" stroke-width="12" fill="none"/><circle class="arc" cx="90" cy="90" r="${RR}" stroke="#2f2e2b" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${RC}" stroke-dashoffset="${RC}" transform="rotate(-90 90 90)"/></svg>
          <div class="num"><div class="strip"></div><div class="final" style="position:absolute;left:0;right:0;top:0">100</div></div><div class="lb">${label}</div>`;
        r.querySelector('.strip').innerHTML = Array.from({ length: 100 }, (_, n) => `<div style="height:56px">${n}</div>`).join('');
        return r;
      });

      // ---------- S6 ----------
      $('#role').textContent = T.role;
      $('#pMark').innerHTML = BRAND.markSvg();
      const nameHtml = 'João Carmassi'.split('').map((c) => `<span class="ln2"><span class="ch">${c === ' ' ? '&nbsp;' : c}</span></span>`).join('');
      $('#pName').innerHTML = nameHtml;
      $('#glint').innerHTML = nameHtml;
      $('#cta').textContent = T.cta;

      // ---------- baselines ----------
      gsap.set('#sketch path', { attr: { 'stroke-dasharray': '1 1', 'stroke-dashoffset': 1 } });
      gsap.set('#win1', { clipPath: 'inset(0% 100% 0% 0% round 18px)' });
      gsap.set(codeLines.map((l) => l.querySelector('.t')), { clipPath: 'inset(0 100% 0 0)' });
      gsap.set(apps, { opacity: 0 });
      gsap.set(['#curve', '#curveGlow'], { attr: { 'stroke-dasharray': '1 1', 'stroke-dashoffset': 1 } });
      gsap.set(['#dot', '#dotGlow'], { attr: curvePts[0], opacity: 0 });
      gsap.set(barEls, { scaleY: 0 });
      gsap.set('#pbtn', { xPercent: -50 });
      gsap.set('#shine', { x: -200 });
      gsap.set('#query', { clipPath: 'inset(0 100% 0 0)' });
      gsap.set(results, { y: (i) => i * RES_GAP, opacity: 0 });
      gsap.set('#cta', { xPercent: -50, opacity: 0 });
      gsap.set(['#ruleT', '#ruleB'], { scaleX: 0 });
      gsap.set(['#role', '#pMark', '#stackLine'], { opacity: 0 });
      gsap.set('#pName .ch', { yPercent: 105 });
      gsap.set('#glint', { opacity: 0 });
      gsap.set('#glint .ch', { backgroundPosition: '100% 0' });
      rings.forEach((r) => { gsap.set(r, { opacity: 0 }); gsap.set(r.querySelector('.final'), { opacity: 0 }); });

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true });
      BRAND.intro(tl);

      // S1 (2.7 -> 6.15): a hand sketches the site, then the real one wipes in over it
      tl.fromTo('#s1', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power1.out' }, 2.7);
      $$('#sketch path').forEach((p, i) => tl.to(p, { attr: { 'stroke-dashoffset': 0 }, duration: i === 0 ? 0.5 : 0.28, ease: 'power1.inOut' }, 2.85 + (i === 0 ? 0 : 0.32 + i * 0.09)));
      tl.to('#win1', { clipPath: 'inset(0% 0% 0% 0% round 18px)', duration: 0.55, ease: 'power2.inOut' }, 4.2);
      tl.fromTo('#wipe', { x: 370, opacity: 1 }, { x: 1550, duration: 0.55, ease: 'power2.inOut' }, 4.2);
      tl.to('#wipe', { opacity: 0, duration: 0.1 }, 4.72);
      tl.to('#sketch', { opacity: 0, duration: 0.4 }, 4.5);
      BRAND.capIn(tl, s1Words, 4.4);
      tl.to('#win1', { rotationX: 10, rotationY: -12, y: -14, scale: 0.94, duration: 1.2, ease: 'power2.inOut' }, 4.7);
      // the camera goes into the window
      tl.to('#win1', { rotationX: 0, rotationY: 0, scale: 3.2, duration: 0.5, ease: 'power2.in' }, 5.85);
      BRAND.blurOut(tl, '#s1cap', 5.8, 0.25);
      tl.fromTo('#s2', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power1.in' }, 6.05);
      tl.set('#s1', { opacity: 0 }, 6.35);

      // S2 (6.05 -> 9.3): the code types itself on a tilted plane, then the stack
      tl.fromTo('#codePlane', { rotationX: 30, rotationY: -14, rotationZ: -7, x: 80, y: 140, z: 0 }, { rotationX: 22, rotationY: -8, rotationZ: -5, x: -60, y: -60, duration: 1.7, ease: 'power1.inOut' }, 6.05);
      codeLines.forEach((line, i) => {
        const n = line.textContent.length;
        tl.to(line.querySelector('.t'), { clipPath: 'inset(0 0% 0 0)', duration: Math.max(0.1, n * 0.0045), ease: `steps(${Math.max(1, n)})` }, 6.25 + i * 0.14);
      });
      tl.to('#codePlane', { y: 520, z: -300, rotationX: 40, opacity: 0, filter: 'blur(10px)', duration: 0.5, ease: 'power2.in' }, 7.7);
      tl.fromTo('#iconGrid', { rotationX: 30, rotationZ: -5, y: 40 }, { rotationX: 22, rotationZ: 3, y: 0, duration: 1.7, ease: 'power1.inOut' }, 7.75);
      const ORDER = [0, 1, 3, 2, 4, 6, 5, 7, 8];
      apps.forEach((a, i) => tl.fromTo(a, { opacity: 0, z: -260, y: 40, filter: 'blur(12px)' }, { opacity: 1, z: 0, y: 0, filter: 'blur(0px)', duration: 0.55, ease: 'back.out(1.4)' }, 7.85 + ORDER[i] * 0.06));
      tl.fromTo('#s2cap', { opacity: 0, filter: 'blur(10px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.5 }, 8.0);
      // the icons rush past the lens into the work
      apps.forEach((a, i) => tl.to(a, { z: 700, opacity: 0, filter: 'blur(14px)', duration: 0.4, ease: 'power2.in' }, 9.0 + (8 - ORDER[i]) * 0.012));
      BRAND.blurOut(tl, '#s2cap', 9.0, 0.25);

      // S3 (9.25 -> 15.05): the camera flies through four kinds of work
      tl.set('#s3', { opacity: 1 }, 9.25);
      tl.set('#s2', { opacity: 0 }, 9.45);
      tl.fromTo('#s3', { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 9.25);
      tl.to(cam, { z: F, duration: 0.65, ease: 'power3.out' }, 9.25);
      const HOLDS = [[40, -1600 + F, 10.7], [-40, -3200 + F, 12.15], [40, -4800 + F, 13.6]];
      HOLDS.forEach(([x, z, t]) => tl.to(cam, { x, z, duration: 0.55, ease: 'power3.inOut' }, t));
      tl.to(cam, { z: -4800 + 140, x: -120, duration: 0.42, ease: 'power2.in' }, 14.65);
      const CAT_AT = [[9.6, 10.72], [11.05, 12.17], [12.5, 13.62], [13.95, 14.68]];
      CAT_AT.forEach(([a, b], i) => {
        tl.fromTo(cats[i], { opacity: 0, y: 16, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.45, ease: 'power3.out' }, a);
        tl.to(cats[i], { opacity: 0, y: -12, filter: 'blur(8px)', duration: 0.22, ease: 'power2.in' }, b);
      });
      tl.to(pix, { o: 1, duration: 0.3 }, 11.15);
      tl.to(places, { o: 1, duration: 0.3 }, 12.6);
      tl.to(openNow, { o: 1, duration: 0.3 }, 12.78);
      kpis.forEach((k, i) => {
        tl.to(k, { o: 1, duration: 0.25 }, 14.0 + i * 0.09);
        tl.fromTo(k.el.querySelector('b'), { y: 30, scale: 0.7 }, { y: 0, scale: 1, duration: 0.6, ease: 'elastic.out(1, 0.5)' }, 14.0 + i * 0.09);
      });

      // S4 (15.0 -> 17.35): the curve, the dot riding it, elastic bars; then the button
      tl.set('#s4', { opacity: 1 }, 15.0);
      tl.set('#s3', { opacity: 0 }, 15.08);
      tl.fromTo('#s4', { opacity: 0 }, { opacity: 1, duration: 0.12, immediateRender: false }, 15.0);
      tl.to(['#curve', '#curveGlow'], { attr: { 'stroke-dashoffset': 0 }, duration: 0.6, ease: 'power2.inOut' }, 15.05);
      tl.to(['#dot', '#dotGlow'], { opacity: 1, duration: 0.15 }, 15.15);
      tl.to(['#dot', '#dotGlow'], { keyframes: curvePts.slice(1).map((p) => ({ attr: p, duration: 0.8 / 40 })), ease: 'none' }, 15.15);
      tl.fromTo('#easeLbl', { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4 }, 15.2);
      BRAND.capIn(tl, s4Words1, 15.25);
      tl.to(barEls, { scaleY: 1, duration: 0.8, ease: 'elastic.out(1, 0.45)', stagger: 0.045 }, 15.4);
      tl.to(barEls, { scaleY: 0.4, duration: 0.18, ease: 'power2.in', stagger: 0.03 }, 15.85);
      tl.to(barEls, { scaleY: 1, duration: 0.6, ease: 'elastic.out(1, 0.4)', stagger: 0.03 }, 16.05);
      // the camera dollies through to the button
      tl.to('#beat1', { opacity: 0, scale: 1.12, filter: 'blur(14px)', duration: 0.35, ease: 'power2.in' }, 16.05);
      tl.fromTo('#beat2', { opacity: 0, scale: 0.92, filter: 'blur(14px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.45, ease: 'power3.out' }, 16.2);
      BRAND.capIn(tl, s4Words2, 16.4);
      tl.to('#shine', { x: 900, duration: 0.7, ease: 'power2.inOut' }, 16.45);
      tl.fromTo('#cur4', { x: 1500, y: 700, opacity: 0 }, { x: 1060, y: 400, opacity: 1, duration: 0.45, ease: 'power3.out' }, 16.45);
      tl.to('#pbtn', { scale: 0.95, duration: 0.09, yoyo: true, repeat: 1, ease: 'power1.inOut' }, 16.92);
      tl.fromTo('#ripple', { x: 1030, y: 378, scale: 0.3, opacity: 0.9 }, { scale: 3, opacity: 0, duration: 0.5, ease: 'power2.out' }, 16.94);
      BRAND.flash(tl, 17.35);

      // S5 (17.35 -> 21.15): SEO, in the light
      tl.set('#s5', { opacity: 1 }, 17.35);
      tl.set('#s4', { opacity: 0 }, 17.37);
      tl.fromTo('#s5cam', { scale: 0.98 }, { scale: 1.03, duration: 3.8, ease: 'none' }, 17.35);
      BRAND.capIn(tl, s5Words, 17.6);
      tl.fromTo('#search', { opacity: 0, y: 20, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'power3.out' }, 17.45);
      tl.to('#query', { clipPath: 'inset(0 0% 0 0)', duration: 0.6, ease: `steps(${T.query.length})` }, 17.75);
      results.forEach((r, i) => tl.fromTo(r, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.35, ease: 'power2.out' }, 18.3 + i * 0.07));
      // the result climbs to the top
      tl.to(results[3], { y: 0, scale: 1.03, duration: 0.7, ease: 'power3.inOut' }, 18.75);
      [0, 1, 2].forEach((i) => tl.to(results[i], { y: (i + 1) * RES_GAP, duration: 0.7, ease: 'power3.inOut' }, 18.75));
      tl.to(results[3], { scale: 1, duration: 0.4, ease: 'power2.out' }, 19.45);
      rings.forEach((r, i) => {
        const t = 19.05 + i * 0.1;
        tl.fromTo(r, { opacity: 0, scale: 0.85, filter: 'blur(8px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.45, ease: 'power3.out', immediateRender: false }, t);
        tl.to(r.querySelector('.arc'), { attr: { 'stroke-dashoffset': 0 }, duration: 1.2, ease: 'power2.out' }, t + 0.1);
        tl.to(r.querySelector('.strip'), { y: -99 * 56, duration: 1.1, ease: 'power2.out' }, t + 0.1);
        tl.set(r.querySelector('.strip'), { opacity: 0 }, t + 1.22);
        tl.set(r.querySelector('.final'), { opacity: 1 }, t + 1.22);
      });
      // a diagonal wipe, with a bright edge, into the poster
      tl.set('#s6', { opacity: 1 }, 20.8);
      tl.fromTo('#s6', { clipPath: 'polygon(0px 0px, -420px 0px, -820px 820px, 0px 820px)' }, { clipPath: 'polygon(0px 0px, 2760px 0px, 2360px 820px, 0px 820px)', duration: 0.6, ease: 'power2.inOut', immediateRender: false }, 20.8);
      tl.fromTo('#wipeLine', { x: -620, rotation: 26, opacity: 1 }, { x: 2560, duration: 0.6, ease: 'power2.inOut', immediateRender: false }, 20.8);
      tl.to('#wipeLine', { opacity: 0, duration: 0.1 }, 21.35);
      tl.set('#s5', { opacity: 0 }, 21.45);

      // S6 (20.8 -> 23.7): the poster
      tl.to(['#ruleT', '#ruleB'], { scaleX: 1, duration: 0.7, ease: 'power3.inOut', stagger: 0.08 }, 21.05);
      tl.to('#pName .ch', { yPercent: 0, duration: 0.65, ease: 'power3.out', stagger: 0.03 }, 21.2);
      tl.fromTo(['#role', '#pMark', '#stackLine'], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.1, ease: 'power2.out' }, 21.55);
      tl.fromTo('#cta', { opacity: 0, y: 18, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power3.out' }, 21.85);
      tl.set('#glint', { opacity: 1 }, 22.1);
      tl.to('#glint .ch', { backgroundPosition: '0% 0', duration: 0.9, ease: 'power2.inOut' }, 22.15);
      tl.fromTo('#cur6', { x: 1480, y: 760, opacity: 0 }, { x: 1080, y: 594, opacity: 1, duration: 0.5, ease: 'power3.out' }, 22.45);
      tl.to('#cta', { scale: 0.95, duration: 0.09, yoyo: true, repeat: 1, ease: 'power1.inOut' }, 22.98);
      tl.fromTo('#ripple6', { x: 1050, y: 568, scale: 0.3, opacity: 0.9 }, { scale: 3, opacity: 0, duration: 0.5, ease: 'power2.out' }, 23.0);
      BRAND.blurOut(tl, '#s6 > *', 23.35, 0.32);

      BRAND.outro(tl, 23.7, D);

      // the code's depth of field follows the line being typed
      const drawCode = (t) => {
        const f = clamp((t - 6.25) / 0.14, 0, 8);
        codeLines.forEach((l, i) => {
          const k = Math.abs(i - f);
          l.style.filter = `blur(${Math.min(5, k * 1.1).toFixed(2)}px)`;
          l.style.opacity = (0.35 + 0.65 * (1 - Math.min(1, k / 4))).toFixed(3);
        });
      };
      const frame = (t) => {
        if (t > 6.0 && t < 8.3) drawCode(t);
        if (t > 9.2 && t < 15.2) drawWorld();
      };
      tl.eventCallback('onUpdate', () => frame(tl.time()));
      frame(0);
      drawWorld();

      window.__timelines = window.__timelines || {};
      window.__timelines['profissional'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
